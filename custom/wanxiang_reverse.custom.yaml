patch:
  speller/algebra:
    __patch:
      # ** 该选项由切换方案命令写入。如不了解原理，请勿手动修改。 **
      # 可选输入方案："全拼", "自然码", "智能ABC", "小鹤双拼", "微软双拼", "搜狗双拼", "紫光双拼", "国标双拼", "拼音加加", "乱序17", "蓝天双拼", "首道双拼", "大牛双拼", "自然龙", "汉心龙"
      - wanxiang_algebra:/reverse/全拼

      # 可选笔画拆分编码方案：
      # - "hspzn"（横 h、竖 s、撇 p、折 z、捺/点 n）
      # - "hupvd"（横 h、竖 u、撇 p、折 v、捺/点 d）
      # - "hspvd"（横 h、竖 s、撇 p、折 v、捺/点 d）
      # - "hslzy"（横 h、竖 s、撇 l、折 z、捺/点 y）
      - wanxiang_algebra:/reverse/hspzn
