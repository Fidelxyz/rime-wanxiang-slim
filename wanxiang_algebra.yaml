      # 格式 A: 声调在最前
      - derive|^([a-z]{2})(\d)([a-z])([a-z]?)$|$1$2\u$3$4|  # 双拼 + 声调 + 大写辅码 [+ 小写辅码]
      - derive|^([a-z]{2})(\d)([a-z])([a-z])$|$1$2$3\u$4|  # 双拼 + 声调 + 小写辅码 + 大写辅码
