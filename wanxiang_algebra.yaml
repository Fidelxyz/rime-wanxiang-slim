  # 短码英文词前置：允许在长度 <= 3 的编码后输入 / 匹配对应英文词
  - derive|^(.{1,3})$|$1/|
  # 移除特殊字符
  - xform/[-_.+]//
  # 派生为全小写
  - derive/^.+$/\L$0/
  # 派生为全大写
  - derive/^.+$/\U$0/
  # 派生为首字母大写
  - derive/^./\U$0/
  # 派生为前2个字母大写
  - derive/^([a-z]{2})/\U$1/

### 模糊音 ###

# 模糊音：n - l
模糊音_n_l:
  __append:
    - derive/^l/n/
    - derive/^n/l/

# 模糊音：r - y
模糊音_r_y:
  __append:
    - derive/^y/r/
    - derive/^r/y/

# 模糊音：h - f
模糊音_h_f:
  __append:
    - derive/^h/f/
    - derive/^f/h/

# 模糊音：r - l
模糊音_r_l:
  __append:
    - derive/^r/l/
    - derive/^l/r/

# 模糊音：k - g
模糊音_k_g:
  __append:
    - derive/^k/g/
    - derive/^g/k/

# 模糊音：en - eng
模糊音_en_eng:
  __append:
    - derive/(ē|é|ě|è|e)ng(.*)$/$1n$2/
    - derive/(ē|é|ě|è|e)n([^g].*)?$/$1ng$2/

# 模糊音：in - ing
模糊音_in_ing:
  __append:
    - derive/(ī|í|ǐ|ì|i)ng(.*)$/$1n$2/
    - derive/(ī|í|ǐ|ì|i)n([^g].*)?$/$1ng$2/

# 模糊音：c - ch
模糊音_c_ch:
  __append:
    - derive/^ch/c/
    - derive/^c([^h]*)/ch$1/

# 模糊音：z - zh
模糊音_z_zh:
  __append:
    - derive/^zh/z/
    - derive/^z([^h]*)/zh$1/

# 模糊音：s - sh
模糊音_s_sh:
  __append:
    - derive/^sh/s/
    - derive/^s([^h]*)/sh$1/

### 针对特定方案的候选排序优化 ###

# 针对小鹤双拼方案的候选排序优化。部分编码组合对应候选字极少，几乎不参与构词，对此类编码提升对应四码字的优先级。
小鹤双拼提权:
  __append:
    - derive/^(.*?)(\d?);(bl|dx|df|eg|fn|kw|ny|tw|vw|yd|rx|fs|ix|eq)$/$1$3/
    - derive/^(.*?)(\d?);.*?,(bl|dx|df|eg|fn|kw|ny|tw|vw|yd|rx|fs|ix|eq)$/$1$3/

