  # later alternatives remain stored in the dictionary but are not input forms.
  直接辅助:
    __append:
      - xform/Ⅾ//  # 用于Lua判断是否处于直接辅助的标记
      - derive/^([a-z◯]+)(\d?);.*$/$1/  # 纯双拼
      # 词典第一组辅助码
      - derive/^([a-z◯]+)(\d?);.*$/$1$2/  # 双拼 + 声调
      - derive/^([a-z◯]+)(\d?);([a-z]).*$/$1$3/  # 双拼 + 1位辅码
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1$2$3|  # 双拼 + 声调 + 1位辅码
      - derive|^([a-z◯]+)(\d?);([a-z]).*$|$1$3$2|  # 双拼 + 1位辅码 + 声调
      - abbrev/^([a-z◯]+)(\d?);([a-z])([a-z]).*$/$1$3$4/  # 双拼 + 2位辅码
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4$2|  # 双拼 + 字母 + 字母 + 数字
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$2$3$4|  # 双拼 + 数字 + 字母 + 字母
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$2$4|  # 双拼 + 字母 + 数字 + 字母
      - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4/|  # 双拼 + 2位辅码 + /
      # - derive|^([a-z◯]+)(\d?);([a-z])([a-z]).*$|$1$3$4o|  # 双拼 + 2位辅码 + o（应对小企鹅等环境）
      # 词典第二组辅助码（以逗号分隔，利用 [^,]* 零回溯直达逗号）
      - derive/^([a-z◯]+)(\d?);[^,]*,([a-z]).*$/$1$3/  # 双拼 + 1位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1$2$3|  # 双拼 + 声调 + 1位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z]).*$|$1$3$2|  # 双拼 + 1位辅码 + 声调
      - abbrev/^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$/$1$3$4/  # 双拼 + 2位辅码
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$4$2|  # 双拼 + 字母 + 字母 + 数字
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$2$3$4|  # 双拼 + 数字 + 字母 + 字母
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$2$4|  # 双拼 + 字母 + 数字 + 字母
      - derive|^([a-z◯]+)(\d?);[^,]*,([a-z])([a-z]).*$|$1$3$4/|  # 双拼 + 2位辅助码 + /
