schema: wanxiang_pro
source_dir: ../dist/rime-wanxiang-zrm-fuzhu

script: |
  function eq(actual, expected)
    print('Actual:   ' .. tostring(actual))
    print('Expected: ' .. tostring(expected))
    return actual == expected
  end

  function has_cand(text)
    for i = 1, #cand do
      if cand[i].text == text then
        return true
      end
    end
    return false
  end

deploy:
  default:
    tests:
      - send: nihao
        assert: eq(cand[1].text, "你好")
      # Tone Input
      - send: zhe0shi0
        assert: eq(cand[1].text, "这是") and eq(preedit, "zhe⁴ shi⁴")
      - send: zhe0shi8
        assert: eq(cand[1].text, "这时") and eq(preedit, "zhe⁴ shi²")
      # Tone Fallback
      - send: zhe0shi80
        assert: eq(cand[1].text, "这是") and eq(preedit, "zhe⁴ shi⁴")
      - send: zhe0shi08
        assert: eq(cand[1].text, "这时") and eq(preedit, "zhe⁴ shi²")
      # Reverse Lookup
      - send: "`mudui"
        assert: eq(cand[1].text, "棁") and eq(cand[2].text, "树")
      - send: "`muyoucun"
        assert: eq(cand[1].text, "树")
      - send: "`hspnznhsn"
        assert: eq(cand[1].text, "树")
      - send: shu`mudui
        assert: eq(cand[1].text, "树")
      - send: shu`muyoucun
        assert: eq(cand[1].text, "树")
      - send: shu`hspnznhsn
        assert: eq(cand[1].text, "树")
      - send: shu`x
        assert: cand[1].text ~= "树"
      - send: nihao`r
        assert: eq(cand[1].text, "你好")
      - send: nihao`rn
        assert: eq(cand[1].text, "你好")
      - send: nihao`renz
        assert: eq(cand[1].text, "你好")
      - send: nihao`x
        assert: cand[1].text ~= "你好"
      # Simplifier
      - send: weishenme
        assert: eq(cand[1].text, "为什么")
      # English
      - send: english
        assert: eq(cand[1].text, "English")
      - send: hello
        assert: eq(cand[1].text, "hello")
      - send: Hello
        assert: eq(cand[1].text, "Hello")
      - send: HEllo
        assert: eq(cand[1].text, "HELLO")
      - send: HELLO
        assert: eq(cand[1].text, "HELLO")
      - send: a
        assert: has_cand("a") and has_cand("A")
      - send: A
        assert: has_cand("A") and has_cand("a")
      - send: i/
        assert: eq(cand[1].text, "I")
      - send: an/
        assert: eq(cand[1].text, "an")
      - send: and/
        assert: eq(cand[1].text, "and")
      # Emoji
      - send: haha
        assert: cand[2].text ~= "😄"
      # Charset Filter
      - send: ei
        assert: has_cand("诶")
      # Unicode
      - send: U4f60
        assert: "eq(cand[1].text, '你') and eq(cand[1].comment, 'U4F60') and eq(cand[2].text, '\U0004F600') and eq(cand[2].comment, 'U4F60~0')"
      # Commands
      - send: /version
        assert: cand[1].text:find("万象拼音精简版〔进阶版 Pro〕", 1, true) ~= nil
      - send: /pinyin
        assert: eq(cand[1].text, "已切换至〔全拼〕方案，请重新部署。")
      - send: /jjf
        assert: eq(cand[1].text, "已切换至〔间接辅助〕方案，请重新部署。")

  tone-pinyin-code:
    options:
      raw_code: false
      tone_pinyin_code: true
    tests:
      - send: zheshi
        assert: eq(cand[1].text, "这是") and eq(preedit, "zhè shì")
      - send: zhe0shi0
        assert: eq(cand[1].text, "这是") and eq(preedit, "zhè⁴ shì⁴")
      - send: zhe0shi8
        assert: eq(cand[1].text, "这时") and eq(preedit, "zhè⁴ shí²")

  emoji:
    options:
      emoji: true
    tests:
      - send: haha
        assert: eq(cand[2].text, "😄") and eq(cand[2].comment, "〔哈哈〕")

  zh-hant:
    options:
      zh_cn: false
      zh_hant: true
    tests:
      - send: weishenme
        assert: eq(cand[1].text, "爲什麼")
      - send: zheli
        assert: eq(cand[1].text, "這裏")

  zh-hk:
    options:
      zh_cn: false
      zh_hk: true
    tests:
      - send: weishenme
        assert: eq(cand[1].text, "為什麼")
      - send: zheli
        assert: eq(cand[1].text, "這裏")

  zh-tw:
    options:
      zh_cn: false
      zh_tw: true
    tests:
      - send: weishenme
        assert: eq(cand[1].text, "為什麼")
      - send: zheli
        assert: eq(cand[1].text, "這裡")

  decomposition-hint:
    options:
      decomposition_hint: true
    tests:
      - send: ni
        assert: eq(cand[1].text, "你") and eq(cand[1].comment, "亻尔 re")

  charset-filter:
    options:
      charset_filter: true
    tests:
      - send: ei
        assert: not has_cand("诶")

  candidate-pinner:
    tests:
      # Pin a candidate that is not initially first.
      - send: zheshi
        assert: cand[1].text ~= "这时" and has_cand("这时")
      - send: zhe0shi8
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "")
      - send: "zhe0shi8{Control+p}"
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "·")
      - send: zheshi
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "·")
      # A pinned prefix must not displace the complete phrase.
      - send: zheshihou
        assert: eq(cand[1].text, "这时候") and eq(cand[1].comment, "") and has_cand("这时")
      # Unpin the candidate.
      - send: "zheshi{Control+l}"
        assert: cand[1].text ~= "这时" and has_cand("这时")
      - send: zheshi
        assert: cand[1].text ~= "这时" and has_cand("这时")
      - send: zhe0shi8
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "")

  user-dict:
    tests:
      # English User Dictionary
      - send: notaword
        assert: cand[1] == nil or cand[1].text ~= "notaword"
      - send: "``notaword"
        assert: eq(cand[1].text, "notaword")
      - send: "``notaword "
        assert: eq(commit, "notaword")
      - send: notaword
        assert: eq(cand[1].text, "notaword")

  candidate-type-marker:
    patch:
      translator/enable_user_dict: true
      candidate_type_marker/types/phrase: "[phrase]"
      candidate_type_marker/types/user_phrase: "[user_phrase]"
      candidate_type_marker/types/table: "[table]"
      candidate_type_marker/types/sentence: "[sentence]"
      candidate_type_marker/types/completion: "[completion]"
      candidate_type_marker/types/pinned: "[pinned]"
      candidate_type_marker/types/unicode: "[unicode]"
      candidate_type_marker/types/message: "[message]"
    tests:
      # Phrase
      - send: ni'hao
        assert: eq(cand[1].text, "你好") and eq(cand[1].comment, "[phrase]")
      # User phrase
      - send: "ni'hao{space}ni'hao"
        assert: eq(cand[1].text, "你好") and eq(cand[1].comment, "[user_phrase]")
      # Table
      - send: hello
        assert: eq(cand[1].text, "hello") and eq(cand[1].comment, "[table]")
      - send: Hello
        assert: eq(cand[1].text, "Hello") and eq(cand[1].comment, "[table]")
      # Sentence
      - send: ni'hao'shi'jie
        assert: eq(cand[1].text, "你好世界") and eq(cand[1].comment, "[sentence]")
      # Completion
      - send: si'hai'wei'jia
        assert: eq(cand[2].text, "四海为家此路穷") and eq(cand[2].comment, "[completion]")
      # Pinned
      - send: "zhe0'shi8{Control+p}"
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "[pinned]")
      - send: zhe'shi
        assert: eq(cand[1].text, "这时") and eq(cand[1].comment, "[pinned]")
      - send: "zhe'shi{Control+l}"
        assert: cand[1].comment ~= "[pinned]"
      # Unicode
      - send: U4f60
        assert: eq(cand[1].text, "你") and eq(cand[1].comment, "U4F60[unicode]") and eq(cand[2].comment, "U4F60~0[unicode]")
      # Message
      - send: /version
        assert: eq(cand[1].comment, "[message]")

  charset-filter-whitelist:
    patch:
      charset_filter/filters/@0/whitelist: "诶"
    options:
      charset_filter: true
    tests:
      - send: ei
        assert: has_cand("诶")

  charset-filter-blacklist:
    patch:
      charset_filter/filters/@0/blacklist: "你"
    options:
      charset_filter: true
    tests:
      - send: ni
        assert: not has_cand("你")
      - send: nihao
        assert: not has_cand("你好")
      - send: hao
        assert: has_cand("好")

  command-disabled:
    patch:
      command/enabled: false
    tests:
      - send: /version
        assert: eq(#cand, 0)
      - send: /pinyin
        assert: eq(#cand, 0)
      - send: /jjf
        assert: eq(#cand, 0)

  direct-auxiliary-code:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/自然码
          - wanxiang_algebra:/pro/直接辅助
    tests:
      # First auxiliary-code group.
      - send: nir
        assert: eq(cand[1].text, "你")
      - send: nire
        assert: eq(cand[2].text, "你")
      - send: nire/
        assert: eq(cand[1].text, "你")
      - send: niRe
        assert: eq(cand[1].text, "你")
      - send: nirE
        assert: eq(cand[1].text, "你")
      - send: niRE
        assert: eq(cand[1].text, "你")
      - send: ni9r
        assert: eq(cand[1].text, "你")
      - send: nir9
        assert: eq(cand[1].text, "你")
      - send: ni9re
        assert: eq(cand[1].text, "你")
      - send: nir9e
        assert: eq(cand[1].text, "你")
      - send: nire9
        assert: eq(cand[1].text, "你")
      - send: ni9R
        assert: eq(cand[1].text, "你")
      - send: niR9
        assert: eq(cand[1].text, "你")
      - send: ni9RE
        assert: eq(cand[1].text, "你")
      - send: niR9E
        assert: eq(cand[1].text, "你")
      - send: niRE9
        assert: eq(cand[1].text, "你")
      # Second auxiliary-code group.
      - send: zlu
        assert: eq(cand[1].text, "在")
      - send: zlut
        assert: eq(cand[1].text, "在")
      - send: zlut/
        assert: eq(cand[1].text, "在")
      - send: zlUt
        assert: eq(cand[1].text, "在")
      - send: zluT
        assert: eq(cand[1].text, "在")
      - send: zlUT
        assert: eq(cand[1].text, "在")
      - send: zl0u
        assert: eq(cand[1].text, "在")
      - send: zlu0
        assert: eq(cand[1].text, "在")
      - send: zl0ut
        assert: eq(cand[1].text, "在")
      - send: zlu0t
        assert: eq(cand[1].text, "在")
      - send: zlut0
        assert: eq(cand[1].text, "在")
      - send: zl0U
        assert: eq(cand[1].text, "在")
      - send: zlU0
        assert: eq(cand[1].text, "在")
      - send: zl0UT
        assert: eq(cand[1].text, "在")
      - send: zlU0T
        assert: eq(cand[1].text, "在")
      - send: zlUT0
        assert: eq(cand[1].text, "在")

  indirect-auxiliary-code:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/自然码
          - wanxiang_algebra:/pro/间接辅助
    tests:
      # First auxiliary-code group.
      - send: ni/r
        assert: eq(cand[1].text, "你")
      - send: ni9/r
        assert: eq(cand[1].text, "你")
      - send: ni/re
        assert: eq(cand[1].text, "你")
      - send: ni9/re
        assert: eq(cand[1].text, "你")
      - send: niR
        assert: eq(cand[1].text, "你")
      - send: ni9R
        assert: eq(cand[1].text, "你")
      - send: niR9
        assert: eq(cand[1].text, "你")
      - send: niRE
        assert: eq(cand[1].text, "你")
      - send: ni9RE
        assert: eq(cand[1].text, "你")
      - send: niR9E
        assert: eq(cand[1].text, "你")
      - send: niRE9
        assert: eq(cand[1].text, "你")
      # First and second auxiliary-code group.
      - send: zl/ta
        assert: eq(cand[1].text, "在")
      - send: zl/ut
        assert: eq(cand[1].text, "在")
      - send: zl0/ut
        assert: eq(cand[1].text, "在")
      - send: zlUT
        assert: eq(cand[1].text, "在")
      - send: zl0UT
        assert: eq(cand[1].text, "在")
      - send: zlU0T
        assert: eq(cand[1].text, "在")
      - send: zlUT0
        assert: eq(cand[1].text, "在")
      - send: zl/u
        assert: eq(cand[1].text, "在")
      - send: zl0/u
        assert: eq(cand[1].text, "在")
      - send: zlU
        assert: eq(cand[1].text, "在")
      - send: zl0U
        assert: eq(cand[1].text, "在")
      - send: zlU0
        assert: eq(cand[1].text, "在")

  indirect-auxiliary-code-pinyin:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/全拼
          - wanxiang_algebra:/pro/间接辅助
    tests:
      - send: "bing/bk bing0/bk bingBK bing0BK bingB0K bingBK0 "
        assert: eq(commit, "并并并并并并")

  indirect-auxiliary-code-gb:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/国标双拼
          - wanxiang_algebra:/pro/间接辅助
    tests:
      - send: "l/aa l8/aa lAA l8AA lA8A lAA8 "
        assert: eq(commit, "而而而而而而")

  indirect-auxiliary-code-sogou:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/搜狗双拼
          - wanxiang_algebra:/pro/间接辅助
    tests:
      - send: "b;/bk b;0/bk b;BK b;0BK b;B0K b;BK0 "
        assert: eq(commit, "并并并并并并")

  schema-pinyin:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/全拼
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "ta po de zai mei hao dou dan fen rang deng er shi xia ye yao jiu nian xin jiang bing yong chu zhua wo kuai dui suan lun guang weng cong yu yue yuan qun "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "taRY poUP deBU zaiTA meiDU haoNZ douEV danRD fenBD rangYU dengVS erAA shiOP xiaAB yeGG yaoXN jiuYJ nianRA xinJQ jiangPC bingBK yongKF chuCK zhuaFV woPD kuaiXD duiCY suanVC lunYL guangEA wengYG congRR yuAA yueOY yuanIX qunYJ "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "ta7 po0 de0 zai0 mei8 hao9 dou7 dan0 fen7 rang0 deng9 er8 shi0 xia0 ye9 yao0 jiu0 nian8 xin7 jiang7 bing0 yong0 chu7 zhua7 wo9 kuai0 dui0 suan0 lun0 guang7 weng7 cong8 yu9 yue0 yuan8 qun8 "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")

  schema-zrm:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/自然码
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "ta po de zl mz hk db dj ff rh dg er ui xw ye yk jq nm xn jd by ys iu vw wo ky dv sr lp gd wg cs yu yt yr qp "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "taRY poUP deBU zlTA mzDU hkNZ dbEV djRD ffBD rhYU dgVS erAA uiOP xwAB yeGG ykXN jqYJ nmRA xnJQ jdPC byBK ysKF iuCK vwFV woPD kyXD dvCY srVC lpYL gdEA wgYG csRR yuAA ytOY yrIX qpYJ "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "ta7 po0 de0 zl0 mz8 hk9 db7 dj0 ff7 rh0 dg9 er8 ui0 xw0 ye9 yk0 jq0 nm8 xn7 jd7 by0 ys0 iu7 vw7 wo9 ky0 dv0 sr0 lp0 gd7 wg7 cs8 yu9 yt0 yr8 qp8 "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")

  schema-zrlong:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/自然龙
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "tl pg dr zo mr hx dx dj fe rd dy ek ut xx yl yv jo nv xh jy bw yy ia vs wi kf df sc lr gw wc cj ys yd yo qf "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出转我快对算了光翁从与月原去")
      - send: "tlRY pgUP drBU zoTA mrDU hxNZ dxEV djRD feBD rdYU dyVS ekAA utOP xxAB ylGG yvXN joYJ nvRA xhJQ jyPC bwBK yyKF iaCK vsFV wiPD kfXD dfCY scVC lrYL gwEA wcYG cjRR ysAA ydOY yoIX qfYJ "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")

  schema-hxlong:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/汉心龙
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "oe wf hk nb ph mt hx hs vq fu hm bj tl cy jr jw ee yb cv em ia jz sj kz gj uo he zc dx la gh xa js jo ji ah "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出重我快对算论该为从与月原去")
      - send: "oeRY wfUP hkBU nbTA phDU mtNZ hxEV hsRD vqBD fuYU hmVS bjAA tlOP cyAB jrGG jwXN eeYJ ybRA cvJQ emPC iaBK jzKF sjCK kzFV gjPD uoXD heCY zcVC dxYL laEA ghYG xaRR jsAA joOY jiIX ahYJ "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")

  schema-flypy:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/小鹤双拼
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "ta po de zd mw hc dz dj ff rh dg er ui xx ye yc jq nm xb jl bk ys iu vx wo kk dv sr ly gl wg cs yu yt yr qy "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "taRY poUP deBU zdTA mwDU hcNZ dzEV djRD ffBD rhYU dgVS erAA uiOP xxAB yeGG ycXN jqYJ nmRA xbJQ jlPC bkBK ysKF iuCK vxFV woPD kkXD dvCY srVC lyYL glEA wgYG csRR yuAA ytOY yrIX qyYJ "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "ta7 po0 de0 zd0 mw8 hc9 dz7 dj0 ff7 rh0 dg9 er8 ui0 xx0 ye9 yc0 jq0 nm8 xb7 jl7 bk0 ys0 iu7 vx7 wo9 kk0 dv0 sr0 ly0 gl7 wg7 cs8 yu9 yt0 yr8 qy8 "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")

  schema-sogou:
    patch:
      speller/algebra:
        __patch:
          - wanxiang_algebra:/pro/搜狗双拼
          - wanxiang_algebra:/pro/直接辅助
    tests:
      - send: "ta po de zl mz hk db dj ff rh dg or ui xw ye yk jq nm xn jd b; ys iu vw wo ky dv sr lp gd wg cs yu yt yr qp "
        assert: eq(commit, "他破的在没好都但分让等而是下也要就年新将并用出抓我快对算论光翁从与月原群")
      - send: "taRY poUP deBU zlTA mzDU hkNZ dbEV djRD ffBD rhYU dgVS orAA uiOP xwAB yeGG ykXN jqYJ nmRA xnJQ jdPC b;BK ysKF iuCK vwFV woPD kyXD dvCY srVC lpYL gdEA wgYG csRR yuAA ytOY yrIX qpYJ "
