schema: wanxiang_reverse
source_dir: ../dist/rime-wanxiang-base

script: |
  function has_cand(text)
    for i = 1, #cand do
      if cand[i].text == text then
        return true
      end
    end
    return false
  end

deploy:
  schema-pinyin:
    patch:
      speller/algebra:
        __include: wanxiang_algebra:/reverse/全拼
    tests:
      - send: mudui
        assert: has_cand("树")
      - send: muyoucun
        assert: has_cand("树")

