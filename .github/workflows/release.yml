name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - stable

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-slim

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json
          target-branch: ${{ github.ref_name }}

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  release:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build
        run: bash scripts/build.sh

      - name: Commit and push per-scheme branches
        run: |-
          set -euxo pipefail

          schemes=("base" "zrm-fuzhu" "flypy-fuzhu" "moqi-fuzhu" "hanxin-fuzhu" "wubi-fuzhu" "tiger-fuzhu" "shouyou-fuzhu" "shyplus-fuzhu" "wx-fuzhu")

          for scheme in "${schemes[@]}"; do
            branch="wanxiang-${scheme}"
            src_dir="dist/rime-wanxiang-${scheme}"

            echo "=== Building branch ${branch} from ${src_dir} ==="

            if [ ! -d "${src_dir}" ]; then
              echo "Warning: ${src_dir} not found, skip ${branch}."
              continue
            fi

            if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
              git worktree add -b "${branch}" "${branch}" "origin/${branch}"
              # Replace the previous release's files while preserving its history.
              git -C "${branch}" rm -r .
            else
              git worktree add --orphan "${branch}"
            fi

            # Copy the built files from dist/ to the branch
            cp -a "${src_dir}/." "${branch}/"

            (
              cd "${branch}"

              # Generate Plum recipes
              bash ../scripts/generate-plum-recipes.sh "${branch}"

              git add .
              git status

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              if ! git diff --cached --quiet; then
                git commit -m "chore(${branch}): release for ${TAG_NAME}"
              fi
              git push origin "${branch}"
            )
          done

      - name: Generate release note
        id: release-note
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/generate-release-note.sh > release-note.md

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          bodyFile: release-note.md
          artifacts: dist/rime-wanxiang-*.zip
          draft: false
          allowUpdates: true
