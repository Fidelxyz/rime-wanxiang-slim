name: Pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    uses: $/.github/workflows/release-please.yml
    with:
      config-file: .github/prerelease-config.json
      manifest-file: .github/prerelease-manifest.json

  release:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build
        run: bash scripts/build.sh

      - name: Generate release note
        id: release-note
        run: bash scripts/generate-release-note.sh --prerelease > release-note.md

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          bodyFile: release-note.md
          artifacts: dist/rime-wanxiang-*.zip
          draft: false
          prerelease: true
          allowUpdates: true
