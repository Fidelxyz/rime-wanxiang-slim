name: Update Dicts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"  # Monthly

permissions:
  contents: write

env:
  OPENCC_DICTS: "STCharacters STPhrases HKVariants TWVariants"
  UPSTREAM_OWNER: "amzxyz"
  UPSTREAM_REPO: "rime-wanxiang"

jobs:
  update-opencc:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Install OpenCC
        run: |-
          sudo apt-get update
          sudo apt-get install -y opencc

      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: true

      - name: Get latest release tag of OpenCC
        id: opencc-latest-tag
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'BYVoid',
              repo: 'OpenCC',
            });
            core.setOutput('tag', release.tag_name);

      - name: Checkout OpenCC
        uses: actions/checkout@v7
        with:
          repository: BYVoid/OpenCC
          ref: ${{ steps.opencc-latest-tag.outputs.tag }}
          path: opencc

      - name: Remove comment lines from OpenCC dictionary files
        working-directory: opencc/data/dictionary
        run: |-
          for dict in ${OPENCC_DICTS}; do
            sed -i '/^#/d' "${dict}.txt"
          done

      - name: Convert OpenCC text data to OCD2
        run: |-
          for dict in ${OPENCC_DICTS}; do
            opencc_dict -i "opencc/data/dictionary/${dict}.txt" -o "${{ github.event.repository.name }}/opencc/dicts/${dict}.ocd2" -f text -t ocd2
          done

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: ${{ github.event.repository.name }}
          commit_message: "chore(dicts): Update OpenCC data to ${{ steps.opencc-latest-tag.outputs.tag }}"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

  update-schema-dicts:
    runs-on: ubuntu-latest
    needs: update-opencc

    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Get latest release tag of upstream
        id: upstream-latest-tag
        uses: actions/github-script@v9
        with:
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: process.env.UPSTREAM_OWNER,
              repo: process.env.UPSTREAM_REPO,
            });
            core.setOutput('tag', release.tag_name);

      - name: Checkout upstream at latest release
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.upstream-latest-tag.outputs.tag }}
          path: upstream

      - name: Normalize dictionaries and auxiliary-code data
        working-directory: ${{ github.event.repository.name }}
        run: |-
          python3 scripts/update_dicts.py \
            --source "${{ github.workspace }}/upstream" \
            --tag "${{ steps.upstream-latest-tag.outputs.tag }}"

      - name: Sync grammar parameters from upstream
        working-directory: ${{ github.event.repository.name }}
        run: |-
          python3 scripts/update_grammar_params.py \
            --source "${{ github.workspace }}/upstream"

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: ${{ github.event.repository.name }}
          commit_message: "chore(dicts): Update dictionaries to ${{ steps.upstream-latest-tag.outputs.tag }} from upstream"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

  sync-release-pr:
    runs-on: ubuntu-latest
    needs: update-schema-dicts

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          filter: blob:none

      - name: Rebase the release-please PR branch onto the latest main
        run: |-
          set -euxo pipefail

          pr_branch="release-please--branches--${GITHUB_REF_NAME}"

          if ! git fetch origin "${pr_branch}"; then
            echo "No release PR branch '${pr_branch}' yet; nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${pr_branch}" "origin/${pr_branch}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "${pr_branch}" --force
